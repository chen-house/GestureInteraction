<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>手指操作测试</title>
<style>
  :root{ --ink:#1c2b20; --dim:#55644f; --bg:#c9d9b4; --card:#e3ecd6; --line:rgba(28,43,32,.2); --hot:#9a4a18; --ok:#46621f; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font:14px/1.7 -apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif; }
  .wrap{ display:grid; grid-template-columns: minmax(0,1fr) 340px; gap:16px; padding:16px; min-height:100vh; }
  .stage{ position:relative; background:#11180f; border-radius:8px; overflow:hidden; aspect-ratio:4/3; align-self:start; }
  video, canvas{ position:absolute; inset:0; width:100%; height:100%; transform:scaleX(-1); }
  video{ object-fit:cover; opacity:.75; }
  .prompt{ position:absolute; left:0; right:0; top:14px; text-align:center; font-size:30px; color:#fff; text-shadow:0 2px 8px rgba(0,0,0,.6); transform:none; pointer-events:none; }
  .sub{ position:absolute; left:0; right:0; bottom:12px; text-align:center; font-size:16px; color:#eef2e8; text-shadow:0 1px 6px rgba(0,0,0,.7); pointer-events:none; }
  .side{ background:var(--card); border-radius:8px; padding:16px; }
  h1{ font-size:17px; font-weight:500; margin:0 0 6px; }
  .note{ color:var(--dim); font-size:12.5px; }
  button{ font:inherit; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:6px; padding:6px 14px; cursor:pointer; margin:4px 6px 4px 0; }
  button:hover{ border-color:var(--hot); color:var(--hot); }
  button[disabled]{ opacity:.4; cursor:default; }
  table{ border-collapse:collapse; width:100%; font-size:12.5px; margin-top:8px; }
  th,td{ text-align:left; padding:3px 4px; border-bottom:1px solid var(--line); }
  th{ font-weight:500; color:var(--dim); }
  .live{ font:12px/1.6 ui-monospace,Menlo,monospace; white-space:pre; color:var(--dim); margin-top:8px; }
  .bar{ height:4px; background:var(--line); border-radius:2px; margin:8px 0; } .bar i{ display:block; height:100%; background:var(--ok); border-radius:2px; width:0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <video id="v" playsinline muted></video>
    <canvas id="c"></canvas>
    <div class="prompt" id="prompt">点右边「开始」</div>
    <div class="sub" id="sub">用右手，掌心朝镜头，离镜头一臂左右</div>
  </div>
  <div class="side">
    <h1>手指操作测试</h1>
    <div class="note">量三种手指操作在这台电脑、这个摄像头上到底认得多准、多快，用来决定一个八度怎么弹。
      一共 60 次，约 3 分钟。每次屏幕上出现一个动作，做出来并保持住，直到出现「✓」或「✗」，再按提示放开。</div>
    <div>
      <button id="go" disabled>开始</button>
      <button id="dl" disabled>下载数据</button>
    </div>
    <div class="bar"><i id="prog"></i></div>
    <div class="note" id="status">正在载入识别模型…</div>
    <div id="result"></div>
    <div class="live" id="live"></div>
  </div>
</div>
<script type="module">
/* ── 三组测试 ───────────────────────────────
   A 拇指捏四根指尖：判「拇指尖离哪根指尖最近、且够近」
   B 拇指点「指尖」还是「中节」：食指、中指各两处，判拇指尖离这四个点里哪个最近
   C 数手指：1＝食指，2＝食指+中指，3＝+无名指，4＝四指，5＝五指全开
   判定：同一个结果连续保持 250ms 才算「认出来」；从出题到认出来的时间记为反应时间
   （含人的反应，三组之间可以比）；认出来之后再记 1 秒，看结果有多稳。
   所有帧的 21 个关键点都存下来，事后可以换阈值重算，不用再测一次。 */
const $ = id => document.getElementById(id);
const REPS = 5, HOLD_MS = 250, STABLE_MS = 1000, TIMEOUT_MS = 5000;
const TH = 0.35;                    // 「够近」：拇指尖到目标点的距离 < 0.35 个掌长（腕到中指根）
const A_T = [["idx","捏食指"],["mid","捏中指"],["rng","捏无名指"],["pky","捏小指"]];
const B_T = [["idxTip","点食指尖"],["idxMid","点食指中节"],["midTip","点中指尖"],["midMid","点中指中节"]];
const C_T = [[1,"伸 1 根（食指）"],[2,"伸 2 根（食指+中指）"],[3,"伸 3 根（食指到无名指）"],[4,"伸 4 根（拇指收起）"],[5,"五指全张开"]];

const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const mid = (a,b) => ({ x:(a.x+b.x)/2, y:(a.y+b.y)/2 });
function palm(lm){ return dist(lm[0], lm[9]) || 1e-6; }
function clsA(lm){ const p=palm(lm), T=[[8,"idx"],[12,"mid"],[16,"rng"],[20,"pky"]];
  let best=null, bd=1e9; for(const [i,k] of T){ const d=dist(lm[4],lm[i])/p; if(d<bd){ bd=d; best=k; } }
  return { cls: bd<TH ? best : null, d:bd }; }
function clsB(lm){ const p=palm(lm), P={ idxTip:lm[8], idxMid:mid(lm[6],lm[7]), midTip:lm[12], midMid:mid(lm[10],lm[11]) };
  let best=null, bd=1e9; for(const k in P){ const d=dist(lm[4],P[k])/p; if(d<bd){ bd=d; best=k; } }
  return { cls: bd<TH ? best : null, d:bd }; }
/* 手指伸直：和乐器页面同一个公式（指尖比第二关节离手腕远出多少，按掌长归一） */
function ext(lm, f){ const p=palm(lm);
  if(f===0){ const d=dist(lm[4],lm[5])/p; return Math.max(0,Math.min(1,(d-0.35)/0.55)); }
  const I=[[0,1,2,3,4],[0,5,6,7,8],[0,9,10,11,12],[0,13,14,15,16],[0,17,18,19,20]][f];
  return Math.max(0,Math.min(1,((dist(lm[I[4]],lm[0])-dist(lm[I[2]],lm[0]))/p-0.10)/0.85)); }
/* 每根手指「算伸直」的线，按这只手标定：C 组开始前张开、握拳各 1.5 秒，取两者中点 */
let THR=[0.5,0.35,0.35,0.35,0.35], calib=null;
function clsC(lm){ const e=[0,1,2,3,4].map(f=>ext(lm,f)); const up=e.map((v,f)=> v > THR[f]);
  return { cls: up.filter(Boolean).length, e }; }

/* ── 载入模型、开摄像头 ── */
let HL=null, video=$("v"), cv=$("c"), ctx=cv.getContext("2d"), lastLm=null, lastT=0;
async function load(){
  const LIBS=["./lib","https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1"];
  const MODELS=["./lib/hand_landmarker.task","https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task"];
  let err=[];
  for(const lib of LIBS){
    try{ const {FilesetResolver, HandLandmarker}=await import(lib+"/vision_bundle.mjs");
      const fs=await FilesetResolver.forVisionTasks(lib+"/wasm");
      for(const m of MODELS){
        try{ HL=await HandLandmarker.createFromOptions(fs,{ baseOptions:{modelAssetPath:m, delegate:"GPU"}, runningMode:"VIDEO", numHands:1,
               minHandDetectionConfidence:0.5, minHandPresenceConfidence:0.5, minTrackingConfidence:0.5 }); return; }
        catch(e){ err.push(m+" → "+e.message); } }
    }catch(e){ err.push(lib+" → "+e.message); }
  }
  throw new Error(err.join("\n"));
}
async function cam(){
  const s=await navigator.mediaDevices.getUserMedia({ video:{ width:{ideal:640}, height:{ideal:480}, frameRate:{ideal:60}, facingMode:"user" }, audio:false });
  video.srcObject=s; await video.play();
}
function loop(){
  if(video.readyState>=2 && HL){
    const t=performance.now();
    if(video.currentTime !== loop.vt){ loop.vt=video.currentTime;
      const r=HL.detectForVideo(video, t); lastLm = r.landmarks && r.landmarks[0] || null; lastT=t; onFrame(t); }
  }
  draw(); requestAnimationFrame(loop);
}
function draw(){
  cv.width=cv.clientWidth*devicePixelRatio; cv.height=cv.clientHeight*devicePixelRatio;
  ctx.clearRect(0,0,cv.width,cv.height); if(!lastLm) return;
  const W=cv.width, H=cv.height;
  ctx.fillStyle="rgba(255,255,255,.85)";
  for(const p of lastLm){ ctx.beginPath(); ctx.arc(p.x*W,p.y*H,3*devicePixelRatio,0,7); ctx.fill(); }
  ctx.fillStyle="#f2c94c"; const th=lastLm[4]; ctx.beginPath(); ctx.arc(th.x*W,th.y*H,6*devicePixelRatio,0,7); ctx.fill();
}

/* ── 测试流程 ── */
let plan=[], ti=-1, trial=null, phase="idle", frames=[], results=[];
const shuffle=a=>{ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function buildPlan(){
  const blk=(g,T)=>shuffle(T.flatMap(([k,l])=>Array(REPS).fill(0).map(()=>({g,target:k,label:l}))));
  return [...blk("A",A_T), ...blk("B",B_T), ...blk("C",C_T)];
}
function next(){
  ti++; $("prog").style.width=(100*ti/plan.length)+"%";
  if(ti>=plan.length){ phase="done"; $("prompt").textContent="测完了，谢谢"; $("sub").textContent="右边是结果；点「下载数据」把原始数据存下来"; report(); return; }
  trial={ ...plan[ti], t0:performance.now(), cand:null, candT:0, decided:null, decT:null, stable:[], firstHit:null };
  phase="ask";
  if(trial.g==="C" && !calib){ calib={ t0:performance.now(), open:[], fist:[] }; phase="calibO"; $("prompt").textContent="先标定：五指全张开，保持"; }
  const head = trial.g==="A" ? "A 组 · 拇指捏指尖" : trial.g==="B" ? "B 组 · 拇指点指尖还是中节" : "C 组 · 数手指";
  if(phase==="ask") $("prompt").textContent=trial.label; $("sub").textContent=`${head}　第 ${ti+1}/${plan.length} 次`;
}
function classify(lm){ if(!lm) return { cls:null };
  return trial.g==="A" ? clsA(lm) : trial.g==="B" ? clsB(lm) : clsC(lm); }
function onFrame(t){
  const live = lastLm ? `A ${JSON.stringify(clsA(lastLm).cls)}  d=${clsA(lastLm).d.toFixed(2)}\nB ${JSON.stringify(clsB(lastLm).cls)}  d=${clsB(lastLm).d.toFixed(2)}\nC ${clsC(lastLm).cls} 根  [${clsC(lastLm).e.map(v=>v.toFixed(2)).join(" ")}]` : "没看到手";
  $("live").textContent = live;
  if(phase==="calibO" || phase==="calibF"){
    if(lastLm){ const e=[0,1,2,3,4].map(f=>ext(lastLm,f)); (phase==="calibO"?calib.open:calib.fist).push(e); }
    if(t-calib.t0>1500){
      if(phase==="calibO"){ phase="calibF"; calib.t0=t; $("prompt").textContent="握拳，保持"; }
      else { const avg=A=>[0,1,2,3,4].map(f=>A.reduce((s,e)=>s+e[f],0)/Math.max(1,A.length));
        const o=avg(calib.open), fz=avg(calib.fist); THR=o.map((v,f)=>(v+fz[f])/2); calib.thr=THR.slice(); calib.o=o; calib.f=fz;
        phase="ask"; trial.t0=performance.now(); $("prompt").textContent=trial.label; }
    }
    return;
  }
  if(!trial || phase==="idle" || phase==="done") return;
  const r=classify(lastLm);
  frames.push({ i:ti, ph:phase, t:Math.round(t), c:r.cls, lm: lastLm ? lastLm.map(p=>[+p.x.toFixed(4),+p.y.toFixed(4),+p.z.toFixed(4)]) : null });
  /* 「放开」：A/B 是没在捏；C 是握拳 —— 只看四指都弯了，拇指不算（握拳时拇指读数不稳） */
  const resting = trial.g==="C" ? (!!r.e && r.e.slice(1).every((v,i)=>v<THR[i+1])) : (r.cls===null);
  if(phase==="ask"){
    if(r.cls===trial.target && trial.firstHit===null) trial.firstHit=t-trial.t0;
    const valid = trial.g==="C" ? r.cls>0 : r.cls!==null;
    if(valid && r.cls===trial.cand){ if(t-trial.candT>=HOLD_MS){ trial.decided=r.cls; trial.decT=t-trial.t0; phase="hold"; trial.holdT=t;
        const ok=trial.decided===trial.target; $("prompt").textContent=(ok?"✓ ":"✗ ")+trial.label+"　保持"; } }
    else { trial.cand = valid ? r.cls : null; trial.candT=t; }
    if(phase==="ask" && t-trial.t0>TIMEOUT_MS){ trial.decided=null; trial.decT=null; phase="release"; $("prompt").textContent="✗ 没认出来　"+(trial.g==="C"?"握拳":"张开手"); }
  } else if(phase==="hold"){
    trial.stable.push(r.cls===trial.decided);
    if(t-trial.holdT>=STABLE_MS){ phase="release"; $("prompt").textContent=trial.g==="C"?"握拳":"张开手"; }
  } else if(phase==="release"){
    if(resting){ results.push({ g:trial.g, target:trial.target, label:trial.label, decided:trial.decided, decT:trial.decT, firstHit:trial.firstHit,
                               stable: trial.stable.length ? trial.stable.filter(Boolean).length/trial.stable.length : null });
                 phase="gap"; setTimeout(next, 400); }
  }
}
function median(a){ const b=a.filter(v=>v!=null).sort((x,y)=>x-y); return b.length ? b[Math.floor(b.length/2)] : null; }
function report(){
  const groups=[["A","拇指捏指尖",A_T],["B","指尖 / 中节",B_T],["C","数手指",C_T]];
  let html="";
  for(const [g,name,T] of groups){
    const R=results.filter(r=>r.g===g), ok=R.filter(r=>r.decided===r.target).length;
    html+=`<h1 style="margin-top:14px">${g} ${name}：${ok}/${R.length} 认对，中位反应 ${median(R.map(r=>r.decT))??"—"} ms</h1><table><tr><th>动作</th><th>认对</th><th>认成别的</th><th>没认出</th><th>反应 ms</th><th>保持稳</th></tr>`;
    for(const [k,l] of T){ const X=R.filter(r=>r.target===k);
      const wrong=X.filter(r=>r.decided!==null && r.decided!==k).map(r=>r.decided), none=X.filter(r=>r.decided===null).length;
      const st=X.map(r=>r.stable).filter(v=>v!=null);
      html+=`<tr><td>${l}</td><td>${X.filter(r=>r.decided===k).length}/${X.length}</td><td>${wrong.join(" ")||"—"}</td><td>${none||"—"}</td><td>${median(X.map(r=>r.decT))??"—"}</td><td>${st.length?Math.round(100*st.reduce((a,b)=>a+b,0)/st.length)+"%":"—"}</td></tr>`; }
    html+="</table>";
  }
  $("result").innerHTML=html; $("dl").disabled=false;
  try{ localStorage.setItem("finger-test-last", JSON.stringify(results)); }catch(e){}
}
$("dl").onclick=()=>{
  const blob=new Blob([JSON.stringify({ when:new Date().toISOString(), ua:navigator.userAgent, th:TH, calib: calib && { thr:calib.thr, open:calib.o, fist:calib.f }, results, frames })],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  const d=new Date(), p=v=>String(v).padStart(2,"0");
  a.download=`finger-test_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.json`; a.click();
};
$("go").onclick=()=>{ $("go").disabled=true; plan=buildPlan(); results=[]; frames=[]; calib=null; THR=[0.5,0.35,0.35,0.35,0.35]; ti=-1; next(); };
(async()=>{
  try{ await cam(); }catch(e){ $("status").textContent="摄像头没打开："+e.message+"（要用「启动.command」打开，地址是 localhost）"; return; }
  try{ await load(); }catch(e){ $("status").textContent="识别模型没加载上：\n"+e.message; return; }
  $("status").textContent="准备好了。先看左边：手在画面里时，白点会跟着手指。"; $("go").disabled=false; loop();
})();
/* 给自测用 */
window.__ft = { clsA, clsB, clsC, ext, setThr:t=>{ THR=t; } };
</script>
</body>
</html>
